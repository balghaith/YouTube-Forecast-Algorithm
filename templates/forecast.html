<!DOCTYPE html>
<html>
<head>
  <title>Forecast: {{ video_id }}</title>
  <style>
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 6px 12px; text-align: right; }
    th { background: #f0f0f0; }
    .locked { background: #eef7ee; }
    .pending { color: #999; }
  </style>
</head>
<body>
  <p><a href="/">&larr; back</a></p>
  <h1>{{ video_id }}</h1>

  <p>Metric:
    <a href="#" onclick="setMetric('views'); return false;">views</a> |
    <a href="#" onclick="setMetric('likes'); return false;">likes</a> |
    <a href="#" onclick="setMetric('comments'); return false;">comments</a>
  </p>

  <p><b id="r2-label">Loading...</b></p>
  <p id="current-label"></p>

  <table>
    <thead><tr><th>Day</th><th>Predicted</th><th>Actual</th></tr></thead>
    <tbody id="forecast-body"></tbody>
  </table>

  <script>
    let currentMetric = "{{ metric }}";

    function setMetric(m) {
      currentMetric = m;
      loadData();
    }

    async function loadData() {
      const res = await fetch(`/api/forecast/{{ video_id }}?metric=${currentMetric}`);
      const data = await res.json();

      document.getElementById("r2-label").textContent =
        `R² = ${data.r_squared} (${data.confidence} confidence)`;
      document.getElementById("current-label").textContent =
        `Currently at day ${data.current_day}: ${data.current_value} ${data.metric}`;

      const body = document.getElementById("forecast-body");
      body.innerHTML = "";

      const days = Object.values(data.checkpoints).sort((a, b) => a.day - b.day);
      for (const row of days) {
        const tr = document.createElement("tr");
        tr.className = row.locked ? "locked" : "";
        const actualText = row.actual === null ? `<span class="pending">pending</span>` : row.actual;
        const predictedText = row.predicted === null ? `<span class="pending">n/a</span>` : row.predicted;
        tr.innerHTML = `<td>${row.day}</td><td>${predictedText}</td><td>${actualText}</td>`;
        body.appendChild(tr);
      }
    }

    loadData();
    setInterval(loadData, 60000);
  </script>
</body>
</html>
