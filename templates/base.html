<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}YT Forecast{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070505;
    --panel: rgba(255, 255, 255, 0.035);
    --panel-raised: rgba(255, 255, 255, 0.065);
    --border: rgba(237, 90, 102, 0.16);
    --text: #f3eceb;
    --text-dim: #a8898c;
    --text-faint: #6e5254;
    --predicted: #e0a23d;
    --predicted-bg: rgba(224, 162, 61, 0.12);
    --actual: #4fae8b;
    --actual-bg: rgba(79, 174, 139, 0.12);
    --removed: #8f8f98;
    --removed-bg: rgba(143, 143, 152, 0.12);
    --accent: #e5394f;
    --accent-bright: #ff5b6e;
    --link: #ff6b78;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  html {
    background: #0f0f0f;
  }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  body {
    background: transparent;
    color: var(--text);
    font-family: "IBM Plex Sans", -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.55;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: var(--fade, 1);
    background:
      radial-gradient(ellipse 1100px 600px at 50% -10%, rgba(197, 32, 48, 0.32), transparent 60%),
      radial-gradient(ellipse 800px 500px at 110% 10%, rgba(140, 16, 28, 0.18), transparent 55%),
      radial-gradient(ellipse 1300px 900px at -10% 85%, rgba(255, 255, 255, 0.34), transparent 65%),
      radial-gradient(ellipse 1300px 900px at 110% 115%, rgba(40, 70, 190, 0.85), transparent 65%);
  }

  .mono {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 2px;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(14, 10, 11, 0.9);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    height: 64px;
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .topbar-left {
    min-width: 0;
    display: flex;
    align-items: center;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .topbar .crumb { color: var(--text-dim); font-size: 14px; }
  .topbar .crumb a { color: var(--link); }

  .trail {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    font-size: 14px;
    color: var(--text-dim);
  }
  .trail a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .trail-avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--panel-raised);
  }
  .trail-avatar-letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .trail a:hover {
    color: var(--text);
    text-decoration: none;
  }
  .trail-sep {
    color: var(--text-faint);
  }
  .trail-here {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    max-width: 420px;
    color: var(--text);
    font-weight: 500;
  }
  .trail-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .trail-mark {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid rgba(237, 90, 102, 0.34);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-bright) !important;
    flex-shrink: 0;
  }
  .trail-mark:hover {
    background: rgba(255, 91, 110, 0.12);
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 4px;
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .status-dot {
    --dot: var(--actual);
    position: relative;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--dot);
    flex-shrink: 0;
  }
  .status-dot::before,
  .status-dot::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid var(--dot);
    animation: status-ripple 2s ease-out infinite;
  }
  .status-dot::after {
    animation-delay: 1s;
  }
  @keyframes status-ripple {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(4.5); opacity: 0; }
  }
  .status-pill.stale .status-dot {
    --dot: var(--predicted);
  }
  .status-pill.idle .status-dot {
    --dot: var(--text-faint);
  }
  .status-pill.idle .status-dot::before,
  .status-pill.idle .status-dot::after {
    animation: none;
    opacity: 0;
  }

  .bell-wrap {
    position: relative;
  }
  .bell-btn {
    position: relative;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 50%;
    border: none;
    background: none;
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .bell-btn:hover,
  .bell-btn.open {
    background: var(--panel-raised);
    color: var(--text);    text-decoration: none;
  }
  .bell-count {
    position: absolute;
    top: -6px;
    right: -6px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    box-sizing: border-box;
    border-radius: 9px;
    border: 2px solid #0b0708;
    background: var(--accent-bright);
    color: #1a0508;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bell-count[hidden] {
    display: none;
  }
  .shell {
    flex: 1 0 auto;
    width: 100%;
    max-width: 880px;
    margin: 0 auto;
    padding: 36px 28px 80px;
  }

  .site-footer {
    border-top: 1px solid var(--border);
    padding: 34px 28px 36px;
    text-align: center;
  }
  .site-footer .trail-mark {
    margin: 0 auto 14px;
  }
  .site-footer-name {
    font-size: 14px;
    color: var(--text);
  }
  .site-footer-rights {
    margin: 5px 0 0;
    font-size: 13px;
    color: var(--text-dim);
  }

  h1 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .lede { color: var(--text-dim); margin: 0 0 32px; font-size: 14.5px; }

  .section-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    margin: 0 0 14px;
  }

  .stat-row {
    display: flex;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 36px;
  }
  .stat-tile {
    flex: 1;
    background: var(--panel);
    padding: 16px 20px;
  }
  .stat-tile .value {
    font-family: "IBM Plex Mono", monospace;
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .stat-tile .label {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 2px;
  }

  .list {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .list-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .list-row:last-child { border-bottom: none; }
  a.list-row { display: flex; }
  a.list-row:hover { background: var(--panel-raised); text-decoration: none; }
  .list-row .primary { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-row .secondary { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  .list-row .right { flex-shrink: 0; display: flex; align-items: center; gap: 10px; }
  .chevron { color: var(--text-faint); font-size: 15px; }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    border: 1px solid var(--border);
    background: var(--panel-raised);
  }
  .avatar.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 14px;
    color: var(--text-dim);
  }

  .badge {
    font-size: 12px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.active { background: var(--actual-bg); color: var(--actual); }
  .badge.expired { background: var(--predicted-bg); color: var(--predicted); }
  .badge.removed { background: var(--removed-bg); color: var(--removed); }

  .empty {
    color: var(--text-dim);
    padding: 28px 18px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    font-size: 14px;
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      {% block crumb %}{% endblock %}
    </div>
    <div class="topbar-right">
      <div class="status-pill idle" id="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">Checking</span>
      </div>
      <div class="bell-wrap" id="bell-wrap">
        <a class="bell-btn{% if request.path == '/activity' %} open{% endif %}" id="bell-btn" href="/activity" aria-label="Activity">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9a6 6 0 0112 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/>
            <path d="M10 20a2 2 0 004 0"/>
          </svg>
          <span class="bell-count mono" id="bell-count" hidden></span>
        </a>
      </div>
    </div>
  </div>
  <div class="shell">
    {% block content %}{% endblock %}
  </div>
  <footer class="site-footer">
    <a class="trail-mark" href="/" aria-label="Home"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l14 8-14 8z"/></svg></a>
    <div class="site-footer-name">Built by Bader Al Ghaith</div>
    <p class="site-footer-rights">&copy; 2026 &middot; All rights reserved</p>
  </footer>
  <script>
    (function () {
      var DISTANCE = 360;
      var queued = false;
      function apply() {
        queued = false;
        var t = Math.min(1, Math.max(0, (window.scrollY || 0) / DISTANCE));
        var eased = t * t * (3 - 2 * t);
        document.documentElement.style.setProperty("--fade", (1 - eased).toFixed(3));
      }
      window.addEventListener("scroll", function () {
        if (!queued) {
          queued = true;
          requestAnimationFrame(apply);
        }
      }, { passive: true });
      apply();
    })();

    (function () {
      const pill = document.getElementById("status-pill");
      const statusText = document.getElementById("status-text");
      const bellCount = document.getElementById("bell-count");
      const SEEN_KEY = "ytf_activity_seen";
      const TZ = "America/Los_Angeles";
      let events = [];
      let lastChecked = null;

      const readSeen = () => {
        try {
          return Number(localStorage.getItem(SEEN_KEY)) || (Date.now() - 86400000);
        } catch (err) {
          return Date.now() - 86400000;
        }
      };
      const writeSeen = value => {
        try {
          localStorage.setItem(SEEN_KEY, String(value));
        } catch (err) {
          return;
        }
      };
      const esc = value => String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

      const ago = ms => {
        const minutes = Math.floor(ms / 60000);
        if (minutes < 1) return "just now";
        if (minutes < 60) return minutes + " min ago";
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return hours + " hour" + (hours === 1 ? "" : "s") + " ago";
        const days = Math.floor(hours / 24);
        return days + " day" + (days === 1 ? "" : "s") + " ago";
      };

      const renderStatus = () => {
        if (!lastChecked) {
          statusText.textContent = "No data yet";
          pill.className = "status-pill idle";
          return;
        }
        const diff = Date.now() - lastChecked;
        statusText.textContent = "Last checked " + ago(diff);
        pill.className = "status-pill" + (diff > 3 * 3600000 ? " stale" : "");
      };

      const unread = () => {
        const seen = readSeen();
        return events.filter(event => new Date(event.ts).getTime() > seen).length;
      };

      const renderCount = () => {
        const count = unread();
        bellCount.hidden = count === 0;
        bellCount.textContent = count > 9 ? "9+" : String(count);
      };

      const load = async () => {
        try {
          const res = await fetch("/api/activity");
          const data = await res.json();
          events = data.events || [];
          lastChecked = data.last_checked ? new Date(data.last_checked).getTime() : null;
          renderStatus();
          renderCount();
        } catch (err) {
          statusText.textContent = "Offline";
        }
      };

      load();
      setInterval(load, 120000);
      setInterval(renderStatus, 30000);
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
